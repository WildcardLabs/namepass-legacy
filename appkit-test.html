<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>namepass AppKit ESM test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #fdfbf7; color: #222; padding: 24px; }
    .card { max-width: 720px; margin: 0 auto; background: white; border: 2px solid #222; border-radius: 18px; padding: 22px; box-shadow: 6px 6px 0 #222; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { color: #555; line-height: 1.45; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
    button { border: 2px solid #222; background: #ff4d4d; color: white; border-radius: 12px; padding: 12px 16px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0 #222; }
    button.secondary { background: #fff9c4; color: #222; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: 140px 1fr; gap: 8px 12px; margin-top: 18px; }
    .label { color: #777; font-weight: 700; }
    code, pre { background: #f3f0ea; border-radius: 10px; }
    code { padding: 2px 6px; }
    pre { padding: 14px; overflow: auto; min-height: 180px; white-space: pre-wrap; }
    .ok { color: #157f3b; font-weight: 700; }
    .bad { color: #b42318; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <h1>namepass AppKit ESM test</h1>
    <p>This version avoids <code>@reown/appkit-cdn</code> named exports and imports the normal AppKit + Ethers adapter through <code>esm.sh</code> with bundling.</p>

    <div class="row">
      <button id="openBtn" disabled>Open AppKit</button>
      <button id="accountBtn" class="secondary" disabled>Account modal</button>
      <button id="networkBtn" class="secondary" disabled>Network modal</button>
      <button id="signBtn" class="secondary" disabled>Sign test message</button>
      <button id="disconnectBtn" class="secondary" disabled>Disconnect</button>
    </div>

    <div class="grid">
      <div class="label">Load</div><div id="loadState">Loading modules…</div>
      <div class="label">Connected</div><div id="connected">false</div>
      <div class="label">Address</div><div id="address">—</div>
      <div class="label">Chain ID</div><div id="chainId">—</div>
      <div class="label">Provider</div><div id="providerState">—</div>
    </div>

    <h3>Log</h3>
    <pre id="log"></pre>
  </div>

  <script type="module">
    const projectId = '30e2ea901580311e378e5fb6eee06ee0';
    const logEl = document.getElementById('log');
    const loadState = document.getElementById('loadState');
    const openBtn = document.getElementById('openBtn');
    const accountBtn = document.getElementById('accountBtn');
    const networkBtn = document.getElementById('networkBtn');
    const signBtn = document.getElementById('signBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const connectedEl = document.getElementById('connected');
    const addressEl = document.getElementById('address');
    const chainIdEl = document.getElementById('chainId');
    const providerStateEl = document.getElementById('providerState');

    let modal = null;
    let eip155Provider = null;
    let currentAddress = null;

    function log(...args) {
      const line = args.map((x) => {
        if (typeof x === 'string') return x;
        try { return JSON.stringify(x, null, 2); } catch { return String(x); }
      }).join(' ');
      logEl.textContent += line + '\n';
      console.log(...args);
    }

    function short(addr) {
      return addr ? addr.slice(0, 6) + '…' + addr.slice(-4) : '—';
    }

    function setConnectedState(state = {}) {
      const isConnected = !!state.isConnected;
      currentAddress = state.address || null;
      connectedEl.textContent = String(isConnected);
      connectedEl.className = isConnected ? 'ok' : 'bad';
      addressEl.textContent = currentAddress ? `${state.address} (${short(state.address)})` : '—';
      chainIdEl.textContent = state.chainId ? String(state.chainId) : '—';
      signBtn.disabled = !isConnected || !eip155Provider;
      disconnectBtn.disabled = !isConnected;
      accountBtn.disabled = !isConnected;
      networkBtn.disabled = false;
    }

    try {
      const [appkit, ethersAdapter, networks] = await Promise.all([
        import('https://esm.sh/@reown/appkit@1.8.20?bundle'),
        import('https://esm.sh/@reown/appkit-adapter-ethers@1.8.20?bundle'),
        import('https://esm.sh/@reown/appkit@1.8.20/networks?bundle')
      ]);

      const { createAppKit } = appkit;
      const { EthersAdapter } = ethersAdapter;
      const { mainnet, base, arbitrum, optimism, polygon } = networks;

      if (!createAppKit) throw new Error('createAppKit was not exported');
      if (!EthersAdapter) throw new Error('EthersAdapter was not exported');

      const appNetworks = [mainnet, base, arbitrum, optimism, polygon];

      modal = createAppKit({
        adapters: [new EthersAdapter()],
        networks: appNetworks,
        defaultNetwork: base,
        projectId,
        metadata: {
          name: 'namepass',
          description: 'Keep ENS names alive from any chain',
          url: window.location.origin,
          icons: [window.location.origin + '/favicon.ico']
        },
        features: {
          analytics: true,
          email: false,
          socials: false,
          swaps: false,
          onramp: false
        },
        themeMode: 'light'
      });

      loadState.innerHTML = '<span class="ok">Loaded</span>';
      openBtn.disabled = false;
      networkBtn.disabled = false;
      log('Loaded AppKit modules:', Object.keys(appkit));
      log('Loaded Ethers adapter exports:', Object.keys(ethersAdapter));
      log('Loaded network exports include:', Object.keys(networks).slice(0, 20));

      modal.subscribeAccount((state) => {
        log('account state', state);
        setConnectedState(state);
      });

      modal.subscribeProviders((state) => {
        eip155Provider = state?.eip155 || null;
        providerStateEl.textContent = eip155Provider ? 'eip155 provider available' : 'no eip155 provider yet';
        log('providers state', Object.keys(state || {}));
      });

      openBtn.onclick = () => modal.open();
      accountBtn.onclick = () => modal.open({ view: 'Account' });
      networkBtn.onclick = () => modal.open({ view: 'Networks' });
      disconnectBtn.onclick = () => modal.disconnect();

      signBtn.onclick = async () => {
        if (!eip155Provider || !currentAddress) return;
        try {
          const browserProvider = new ethers.BrowserProvider(eip155Provider);
          const signer = await browserProvider.getSigner();
          const sig = await signer.signMessage('namepass AppKit test');
          log('signature', sig);
          alert('Signed successfully: ' + sig.slice(0, 18) + '…');
        } catch (err) {
          log('sign failed', err?.message || err);
          alert('Sign failed: ' + (err?.message || err));
        }
      };
    } catch (err) {
      loadState.innerHTML = '<span class="bad">Failed</span>';
      log('MODULE LOAD / INIT ERROR:', err?.stack || err?.message || err);
    }
  </script>
</body>
</html>
